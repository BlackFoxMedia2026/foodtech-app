<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodtech</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font-family: system-ui, -apple-system, sans-serif; background: #f2e7d0; color: #1d3227; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #10201a; color: #f2e7d0; } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 24px; opacity: .75; line-height: 1.5; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 24px;
           background: #2c5545; color: #f2e7d0; }
</style>
</head>
<body>
  <main>
    <h1>Il gestionale non risponde</h1>
    <p>Controlla la connessione del telefono e riprova.</p>
    <button type="button" onclick="location.replace('https://foodtech-app.vercel.app')">Riprova</button>
  </main>
</body>
</html>
